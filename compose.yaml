services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gatemint
      POSTGRES_USER: gatemint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/setup-local.sh first}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatemint -d gatemint"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025"]
  migrate:
    build: .
    command: ["--migrate"]
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Database=gatemint;Username=gatemint;Password=${POSTGRES_PASSWORD}
      DataProtection__KeysPath: /keys
      Tickets__SigningKey: ${TICKET_SIGNING_KEY}
      Payments__Provider: ${PAYMENTS_PROVIDER:-Simulator}
      Payments__AllowSimulator: "true"
      Paystack__SecretKey: ${PAYSTACK_SECRET_KEY:-}
      Paystack__WebhookSecret: ${PAYSTACK_WEBHOOK_SECRET:-}
      Demo__Seed: "true"
      Demo__Password: ${DEMO_PASSWORD}
      Smtp__Host: mailpit
      Smtp__Port: 1025
    volumes: ["data-protection-keys:/keys"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: .
    environment: *api-environment
    volumes: ["data-protection-keys:/keys"]
    ports: ["5080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  data-protection-keys:
